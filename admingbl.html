<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ADMIN PANEL - CONTROL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; margin: 10px; }
        .btn-on { background: #00e676; color: #000; }
        .btn-off { background: #ff1744; color: #fff; }
        .status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>SISTEM KONTROL</h1>
    <p>Gunakan tombol ini untuk mengaktifkan/mematikan fungsi tombol fisik.</p>

    <button class="btn-on" onclick="setSystem('ON')">SISTEM ON (AKTIF)</button>
    <button class="btn-off" onclick="setSystem('OFF')">SISTEM OFF (MATI)</button>

    <div class="status" id="status">Status Sistem: -</div>

    <script>
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = { 
            databaseURL: "https://roullete-gbl-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('control');

        // --- FUNGSI MENGIRIM STATUS KE FIREBASE ---
        function setSystem(val) {
            db.update({ toggle_system: val })
              .then(() => alert("Sistem diubah ke: " + val))
              .catch((err) => alert("Gagal update: " + err));
        }

        // --- MONITOR STATUS SAAT INI ---
        db.child('toggle_system').on('value', (snapshot) => {
            document.getElementById("status").innerText = "Status Sistem: " + (snapshot.val() || "OFF");
        });
    </script>
</body>
</html>
