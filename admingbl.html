<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Admin Panel - Button Lock Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { 
            background: #121212; 
            color: #ffffff; 
            font-family: sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
        }
        h2 { color: #00bcd4; margin-bottom: 30px; }
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .btn { 
            padding: 20px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            border-radius: 10px; 
            width: 100%;
            max-width: 300px;
            text-transform: uppercase;
        }
        .btn-on { background: #2ecc71; color: #000; }
        .btn-off { background: #e74c3c; color: #fff; }
        
        .status-box {
            margin-top: 40px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 8px;
            display: inline-block;
        }
        #status-display { font-size: 20px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>KONTROL AKTIVASI TOMBOL</h2>
    
    <div class="btn-container">
        <button class="btn btn-on" onclick="updateButtonControl('ON')">AKTIFKAN TOMBOL (ON)</button>
        
        <button class="btn btn-off" onclick="updateButtonControl('OFF')">NONAKTIFKAN TOMBOL (OFF)</button>
    </div>

    <div class="status-box">
        <div>STATUS SAAT INI:</div>
        <div id="status-display">LOADING...</div>
    </div>

    <script>
        // Gunakan URL Database yang sama dengan receiver.html
        const firebaseConfig = { 
            databaseURL: "https://roullete-gbl-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('control');

        // Fungsi untuk merubah status di Firebase
        function updateButtonControl(status) {
            db.update({ secret_buttons: status })
              .then(() => console.log("Status berhasil diupdate ke: " + status))
              .catch((err) => alert("Gagal update Firebase!"));
        }

        // Monitor perubahan status secara real-time
        db.child('secret_buttons').on('value', (snapshot) => {
            const val = snapshot.val();
            const display = document.getElementById("status-display");
            
            if (val === "OFF") {
                display.innerText = "OFF (TERKUNCI)";
                display.style.color = "#e74c3c";
            } else {
                display.innerText = "ON (AKTIF)";
                display.style.color = "#2ecc71";
            }
        });
    </script>
</body>
</html>
