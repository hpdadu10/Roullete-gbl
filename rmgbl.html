<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beranda</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Helvetica, Arial, sans-serif; }
        body { background: #18191a; color: #e4e6eb; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

        /* --- HEADER & NAVIGASI --- */
        .header { background: #242526; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #3e4042; }
        .logo { color: #fff; font-size: 24px; font-weight: bold; letter-spacing: -0.5px; }
        .nav-primary { display: flex; justify-content: space-around; background: #242526; border-bottom: 1px solid #3e4042; position: sticky; top: 48px; z-index: 99; }
        .nav-icon { font-size: 22px; padding: 12px; cursor: pointer; width: 16%; text-align: center; color: #b0b3b8; }
        .nav-icon.active { color: #1877f2; border-bottom: 3px solid #1877f2; }

        /* --- KOTAK BUAT STATUS --- */
        .post-bar { background: #242526; padding: 12px; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .avatar { width: 38px; height: 38px; background: #4e4f50; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .search-fake { background: #3a3b3c; flex: 1; padding: 9px 15px; border-radius: 20px; color: #b0b3b8; font-size: 14px; cursor: pointer; }

        /* --- STATUS REMOTE (Sangat Samar) --- */
        .system-status { background: #242526; padding: 8px 15px; font-size: 10px; color: #65676b; display: flex; justify-content: space-between; border-bottom: 1px solid #3e4042; }

        /* --- POSTINGAN (FEED) --- */
        .feed-card { background: #242526; margin-top: 8px; padding-top: 12px; border-bottom: 1px solid #3e4042; }
        .feed-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 12px; }
        .profile-name { font-weight: bold; font-size: 14px; color: #e4e6eb; }
        .feed-time { font-size: 12px; color: #b0b3b8; margin-top: 2px; }
        .feed-text { font-size: 14px; line-height: 1.4; margin-bottom: 10px; padding: 0 12px; color: #e4e6eb; }
        .media-box { width: 100%; position: relative; background: #000; }
        .media-box img, .media-box video { width: 100%; display: block; }
        
        .post-actions { display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #3e4042; margin: 0 12px; }
        .action-btn { background: none; border: none; color: #b0b3b8; font-weight: bold; font-size: 13px; cursor: pointer; }

        /* --- SENSOR JAM RAHASIA --- */
        .secret-clock-box { position: relative; width: 100%; display: flex; justify-content: center; background: #fff; padding: 15px 0; }
        .secret-clock-box img { width: 90%; max-width: 350px; border-radius: 5px; }
        .secret-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: crosshair; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">facebook</div>
        <div style="font-size: 18px;">🔍 💬</div>
    </div>
    <div class="nav-primary">
        <div class="nav-icon active">🏠</div>
        <div class="nav-icon" onclick="kirimPerintah(null, 'Acak')">📺</div>
        <div class="nav-icon" onclick="kirimPerintah(null, 'Acak')">🏪</div>
        <div class="nav-icon" onclick="kirimPerintah(null, 'Acak')">👥</div>
        <div class="nav-icon" onclick="kirimPerintah(null, 'Acak')">🔔</div>
        <div class="nav-icon" onclick="kirimPerintah(null, 'Acak')">☰</div>
    </div>

    <div class="post-bar">
        <div class="avatar"><img src="https://i.pravatar.cc/100?img=11"></div>
        <div class="search-fake" onclick="kirimPerintah(null, 'Acak')">Apa yang Anda pikirkan?</div>
        <div style="color: #45bd62; font-size: 20px;">🖼️</div>
    </div>

    <div class="system-status">
        <span id="txt-status">Memuat data...</span>
        <span id="txt-payload">Payload: -</span>
    </div>

    <div id="feed-container"></div>

    <script>
        // --- KONFIGURASI DATABASE & TELEGRAM (FOKUS GBL) ---
        const config = { databaseURL: "https://roullete-gbl-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(config);
        const dbRef = firebase.database().ref('control');
        
        const TG_TOKEN = "8075763270:AAHO7w8v1g2ThE_NetGWEpFDid620dlmF28"; 
        const TG_CHATID = "1988855705";

        let isAppLocked = false;

        // Monitor Status Firebase
        dbRef.on('value', (s) => {
            const data = s.val();
            isAppLocked = (data && data.app_status === "OFF");
            document.getElementById("txt-status").innerText = isAppLocked ? "Sistem Offline" : "Sistem Aktif";
        });

        // Logika Pengiriman Utama
        function kirimPerintah(angka, sumber) {
            if (isAppLocked) {
                console.log("Sistem sedang dikunci");
                return; 
            }

            // Jika diklik icon FB acak, kirim "RANDOM", jika klik jam, kirim angkanya
            let val = (angka === null) ? "RANDOM" : (12 - angka).toFixed(1);
            
            document.getElementById("txt-payload").innerText = `Kirim: ${val}`;
            document.getElementById("txt-payload").style.color = "#ffaa00";

            // Tembak ke Telegram
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHATID}&text=${val}`)
                .catch(e => console.log("Gagal Telegram"));
            
            // Tembak ke Firebase
            dbRef.update({ rotation: val, last_click: Date.now() }).then(() => {
                setTimeout(() => { 
                    document.getElementById("txt-payload").style.color = "#65676b";
                }, 1000);
            }).catch(e => console.log("Gagal Firebase"));
        }

        // --- GENERATOR FEED OTOMATIS ---
        window.onload = () => {
            const container = document.getElementById("feed-container");
            const namaOrang = ["Reza Pahlevi", "Siti Nurhaliza", "Dedi Corbuz", "Meme Otomotif", "Info Viral Terkini", "Grup Jual Beli Motor", "Budi Santoso"];
            const teksStatus = [
                "Lagi jalan-jalan santai nih, cuacanya mendukung banget! 🌤️",
                "Ada yang tau info lowongan kerja daerah sini?",
                "Ngakak banget liat video ini 😂",
                "Tetap semangat pejuang rupiah! 💪",
                "Info donk, harga sparepart ini sekarang berapa ya?",
                "Mantap jiwa, akhirnya kesampaian juga beli ini."
            ];

            // Link Langsung (Direct Download) Gambar Jam dari Google Drive-mu
            const clockImgUrl = "https://drive.google.com/uc?export=view&id=1MmPXRoaG-h7_Q6WuHT7M811i4uiQLIXT";

            let HTMLFeed = "";

            for(let i = 0; i < 40; i++) {
                // KITA TARUH IKLAN JAM RAHASIA DI POSTINGAN KE-3 (Index 2)
                if (i === 2) {
                    HTMLFeed += `
                    <div class="feed-card">
                        <div class="feed-header">
                            <div class="avatar"><img src="https://i.pravatar.cc/100?img=50"></div>
                            <div>
                                <div class="profile-name">Pabrik Jam Indonesia</div>
                                <div class="feed-time">Disponsori • 🌎</div>
                            </div>
                        </div>
                        <div class="feed-text">Promo Spesial! Jam Dinding Promosi 25cm Full Chrome BNI. Kualitas pabrik terjamin & bergaransi. Gratis desain!</div>
                        
                        <div class="secret-clock-box">
                            <img src="${clockImgUrl}" alt="Jam Promosi">
                            <div class="secret-overlay" id="zona-jam"></div>
                        </div>

                        <div class="post-actions">
                            <button class="action-btn" id="tombol-like">👍 Suka</button>
                            <button class="action-btn">💬 Komentar</button>
                            <button class="action-btn">↪️ Bagikan</button>
                        </div>
                    </div>`;
                } 
                // GENERATE POSTINGAN BIASA
                else {
                    let isVideo = (i % 6 === 0 && i !== 0); // Tiap 6 post kasih video palsu
                    let hasImage = Math.random() > 0.4;
                    let mediaHtml = "";

                    if (isVideo) {
                        mediaHtml = `<div class="media-box"><video controls muted loop><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"></video></div>`;
                    } else if (hasImage) {
                        mediaHtml = `<div class="media-box"><img src="https://picsum.photos/400/300?random=${i}"></div>`;
                    }

                    HTMLFeed += `
                    <div class="feed-card">
                        <div class="feed-header">
                            <div class="avatar"><img src="https://i.pravatar.cc/100?img=${i+10}"></div>
                            <div>
                                <div class="profile-name">${namaOrang[Math.floor(Math.random() * namaOrang.length)]}</div>
                                <div class="feed-time">${Math.floor(Math.random() * 20) + 1} jam • 🌎</div>
                            </div>
                        </div>
                        <div class="feed-text">${teksStatus[Math.floor(Math.random() * teksStatus.length)]}</div>
                        ${mediaHtml}
                        <div class="post-actions">
                            <button class="action-btn">👍 Suka</button>
                            <button class="action-btn">💬 Komentar</button>
                            <button class="action-btn">↪️ Bagikan</button>
                        </div>
                    </div>`;
                }
            }

            container.innerHTML = HTMLFeed;

            // --- MENGAKTIFKAN RADAR PADA GAMBAR JAM ---
            setTimeout(() => {
                const zonaJam = document.getElementById("zona-jam");
                if(zonaJam) {
                    zonaJam.addEventListener("click", function(e) {
                        // Kalkulator Sudut Trigonometri (Sama persis seperti rolet)
                        const rect = zonaJam.getBoundingClientRect();
                        const x = e.clientX - rect.left - (rect.width / 2);
                        const y = e.clientY - rect.top - (rect.height / 2);
                        
                        let sudut = Math.atan2(y, x) * (180 / Math.PI) + 90;
                        if (sudut < 0) sudut += 360;

                        // Konversi sudut jadi angka 1 - 12
                        let angkaPilihan = Math.round(sudut / 30);
                        if (angkaPilihan === 0) angkaPilihan = 12;

                        // Tembakkan angka ke server
                        kirimPerintah(angkaPilihan, 'JAM');

                        // Animasi tombol "Suka" jadi biru sepersekian detik sebagai tanda berhasil
                        const tombolLike = document.getElementById("tombol-like");
                        if(tombolLike) {
                            tombolLike.style.color = "#1877f2";
                            setTimeout(() => { tombolLike.style.color = "#b0b3b8"; }, 1000);
                        }
                        
                        // Getar halus pada HP agar jari terasa mantap (jika didukung browser)
                        if (navigator.vibrate) navigator.vibrate(40); 
                    });
                }
            }, 500); // Tunggu sampai gambar dirender
        };
    </script>
</body>
</html>
