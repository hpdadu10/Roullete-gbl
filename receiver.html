<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GBL RECEIVER v2</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; margin: 0;">
    <div id="status">INIT...</div>
    <div id="last_val">VALUE: -</div>
    <div id="toggle_status" style="color: #00e5ff;">TOGGLE SYSTEM: -</div>
    <div id="secret_status" style="color: #ff007f;">SECRET BUTTONS: -</div>
    <div id="timer" style="color: #ffeb3b;">Idle Timer: 180s</div>

    <script>
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = { 
            databaseURL: "https://roullete-gbl-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('control');

        let countdown = 180;

        // --- 1. MONITOR SAKLAR FISIK (btn_toggle_secret) ---
        db.child('toggle_system').on('value', (snapshot) => {
            const val = snapshot.val() || "OFF"; // "ON" atau "OFF"
            const statusBool = (val === "ON"); 
            
            document.getElementById("toggle_status").innerText = "TOGGLE SYSTEM: " + val;
            document.getElementById("toggle_status").style.color = statusBool ? "#00e676" : "#ff1744";

            // Panggil fungsi penyesuai saklar di Smali
            if (window.AndroidInterface && window.AndroidInterface.setToggleEnabled) {
                window.AndroidInterface.setToggleEnabled(statusBool);
            }
        });

        // --- 2. MONITOR VISIBILITAS 4 TOMBOL SECRET ---
        db.child('secret_visibility').on('value', (snapshot) => {
            const val = snapshot.val() || "OFF"; // "ON" atau "OFF"
            const statusBool = (val === "ON");
            
            document.getElementById("secret_status").innerText = "SECRET BUTTONS: " + val;
            document.getElementById("secret_status").style.color = statusBool ? "#00e676" : "#ff1744";

            // Panggil fungsi penyesuai visibilitas di Smali
            if (window.AndroidInterface && window.AndroidInterface.setSecretVisible) {
                window.AndroidInterface.setSecretVisible(statusBool);
            }
        });

        // --- 3. MONITOR ROTASI (REMOT ANGKA) ---
        db.child('rotation').on('value', (snapshot) => {
            let val = snapshot.val();
            if (val !== null) {
                if (val === "RANDOM") {
                    val = (Math.floor(Math.random() * 12)).toFixed(1);
                }
                document.getElementById("last_val").innerText = "FB VALUE: " + val;
                
                if (window.AndroidInterface && window.AndroidInterface.postMessage) {
                    window.AndroidInterface.postMessage(val.toString());
                }
                countdown = 180;
            }
        });

        // --- 4. AUTO RANDOM (PENGAMAN) ---
        setInterval(() => {
            countdown--;
            document.getElementById("timer").innerText = "Idle Timer: " + countdown + "s";
            if (countdown <= 0) {
                const autoVal = (Math.floor(Math.random() * 12)).toFixed(1);
                if (window.AndroidInterface && window.AndroidInterface.postMessage) {
                    window.AndroidInterface.postMessage(autoVal);
                }
                countdown = 180;
            }
        }, 1000);

        // --- 5. CEK KONEKSI FIREBASE ---
        firebase.database().ref(".info/connected").on("value", (snap) => {
            const el = document.getElementById("status");
            if (snap.val() === true) {
                el.innerText = "CONNECTED (FB GBL)";
                el.style.color = "#0f0";
            } else {
                el.innerText = "DISCONNECTED...";
                el.style.color = "#f00";
            }
        });

        setInterval(() => db.update({ last_seen: Date.now() }), 30000);
    </script>
</body>
</html>
