<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Penerima Core Pro - GBL Clean</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; font-size: 10px;">
    <div id="status">INITIALIZING...</div>
    <div id="last_val">VALUE: -</div>
    <div id="timer-display" style="color: #ffeb3b;">Idle Timer: 180s</div>

    <script>
        // --- KONFIGURASI TUNGGAL FIREBASE (GBL) ---
        const firebaseConfig = { 
            databaseURL: "https://roullete-gbl-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('control');

        // --- 1. LOGIKA AUTO-RANDOM (Mencegah Stuck Offline) ---
        let countdown = 180;
        let randomTicker;

        function startAutoRandom() {
            clearInterval(randomTicker);
            countdown = 180;
            randomTicker = setInterval(() => {
                countdown--;
                document.getElementById("timer-display").innerText = "Idle Timer: " + countdown + "s";
                if (countdown <= 0) {
                    const autoVal = (Math.floor(Math.random() * 12)).toFixed(1);
                    document.getElementById("last_val").innerText = "AUTO: " + autoVal;
                    if (window.AndroidInterface && window.AndroidInterface.postMessage) {
                        window.AndroidInterface.postMessage(autoVal);
                    }
                    countdown = 180; 
                }
            }, 1000);
        }

        // --- 2. MONITOR KONEKSI FIREBASE ---
        firebase.database().ref(".info/connected").on("value", (snap) => {
            const el = document.getElementById("status");
            if (snap.val() === true) {
                el.innerText = "CONNECTED (FB GBL)";
                el.style.color = "#0f0";
            } else {
                el.innerText = "FB DISCONNECTED! RECONNECTING...";
                el.style.color = "#f00";
                firebase.database().goOnline();
            }
        });

        // --- 3. PENGAMBIL DATA FIREBASE (SATU-SATUNYA KENDALI) ---
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                
                // Sensor Global OFF (Tutup Aplikasi)
                if (data.app_status === "OFF") {
                    if (window.AndroidInterface && window.AndroidInterface.closeApp) {
                        window.AndroidInterface.closeApp();
                    }
                    return; 
                }

                // Eksekusi Putaran Rolet
                if (data.rotation !== undefined) {
                    let val = data.rotation.toString();
                    if (val === "RANDOM") val = (Math.floor(Math.random() * 12)).toFixed(1);

                    document.getElementById("last_val").innerText = "FB VALUE: " + val;
                    
                    if (window.AndroidInterface && window.AndroidInterface.postMessage) {
                        window.AndroidInterface.postMessage(val);
                    }
                    
                    startAutoRandom(); 
                }
            }
        });

        // --- 4. MAINTENANCE ---
        setInterval(() => db.update({ keep_alive: Date.now(), client_status: "ACTIVE" }), 25000);

        // --- 5. KONTROL TOMBOL (METODE KOMPLIT: MAGIC, INTENT, & INTERFACE) ---
        db.child('secret_buttons').on('value', (snapshot) => {
            const status = snapshot.val();
            const isActive = (status === "ON");

            // A. JALUR MAGIC NUMBER (777/666)
            const magicNum = isActive ? "666.0" : "777.0";
            if (window.AndroidInterface && window.AndroidInterface.postMessage) {
                window.AndroidInterface.postMessage(magicNum);
            }

            // B. JALUR INTERFACE OPTIMAL (setButtonEnabled)
            // Ini jalur paling aman yang kita tambahkan di Smali tadi
            if (window.AndroidInterface && window.AndroidInterface.setButtonEnabled) {
                window.AndroidInterface.setButtonEnabled(isActive);
            }

            // C. JALUR INTENT (88.0/99.0)
            const intentNum = isActive ? "99.0" : "88.0";
            window.location.href = `intent://control#Intent;scheme=roulette;package=com.mishthua.roulettenumberprp;f.rotation=${intentNum};end`;
        });

        startAutoRandom();
    </script>
</body>
</html>
