<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Monitoring Dadu</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        #btn { width: 100%; padding: 15px; background: #ff0000; color: #fff; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        #btn.on { background: #00ff00; color: #000; }
        #log { height: 350px; overflow-y: auto; margin-top: 15px; background: #050505; padding: 10px; text-align: left; font-family: monospace; font-size: 11px; border: 1px inset #222; }
        .msg { border-bottom: 1px solid #222; padding: 5px 0; color: #0f0; }
        .err { color: #f00; }
    </style>
</head>
<body>

<div class="box">
    <h3>Dadu BK Force Monitor</h3>
    <button id="btn">TAP UNTUK PAKSA CONNECT</button>
    <div id="log">Menunggu aktivasi...</div>
</div>

<script>
    const TOKEN = "8233330794:AAHVHw4_k6QNCzWu450BzABvuJiXGVBi4ZU";
    let lastId = 0;
    let run = false;

    // Fungsi Getar Paksa
    function vibrate(type) {
        if (!navigator.vibrate) return;
        if (type.includes("BESAR")) navigator.vibrate([300, 100, 300]);
        else if (type.includes("KECIL")) navigator.vibrate(600);
    }

    document.getElementById('btn').onclick = function() {
        run = true;
        this.className = "on";
        this.innerText = "MONITORING BERJALAN...";
        document.getElementById('log').innerHTML = "Memulai koneksi paksa...";
        poll();
    };

    async function poll() {
        if (!run) return;

        // Force Offset: Mengambil 5 pesan terakhir tanpa peduli status 'read'
        const offset = lastId === 0 ? -5 : lastId + 1;
        
        try {
            const r = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?offset=${offset}&timeout=15&limit=10`);
            const d = await r.json();

            if (d.ok && d.result.length > 0) {
                d.result.forEach(u => {
                    lastId = u.update_id;
                    if (u.message && u.message.text) {
                        const t = u.message.text.toUpperCase();
                        const time = new Date().toLocaleTimeString();
                        
                        // Cetak ke Log
                        const item = document.createElement('div');
                        item.className = "msg";
                        item.innerHTML = `[${time}] ${u.message.text.replace(/\n/g, '<br>')}`;
                        document.getElementById('log').prepend(item);

                        // Eksekusi Getar
                        vibrate(t);
                    }
                });
            }
        } catch (e) {
            console.log("Retry...");
        }
        setTimeout(poll, 1000); // Cek setiap 1 detik
    }
</script>
</body>
</html>
