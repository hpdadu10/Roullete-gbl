<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Result Dadu BK</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #0f0; padding: 20px; margin: 0; text-align: center; }
        .container { max-width: 450px; margin: auto; border: 2px solid #0f0; padding: 20px; border-radius: 10px; background: #050505; }
        #status-box { padding: 15px; margin-bottom: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; background: #222; border: 1px solid #444; }
        .online { color: #0f0; border-color: #0f0 !important; }
        #log-area { height: 350px; overflow-y: auto; text-align: left; background: #000; padding: 10px; border: 1px inset #222; }
        .item { padding: 8px; border-bottom: 1px solid #111; font-size: 14px; }
        .BSR { color: #ff3333; font-weight: bold; } /* BESAR = MERAH */
        .KCL { color: #33ff33; font-weight: bold; } /* KECIL = HIJAU */
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #fff;">MONITORING LIVE</h2>
    <div id="status-box" onclick="startApp()">TAP DISINI UNTUK START</div>
    
    <div id="log-area">Menunggu data baru...</div>
    
    <p style="font-size: 10px; color: #666; margin-top: 10px;">Getar 2x (Besar) | Getar 1x (Kecil)</p>
</div>

<script>
    const TOKEN = "8233330794:AAHVHw4_k6QNCzWu450BzABvuJiXGVBi4ZU";
    let lastId = 0;
    let running = false;

    function vibrate(msg) {
        if (!navigator.vibrate) return;
        if (msg.includes("BESAR")) navigator.vibrate([200, 100, 200]);
        else if (msg.includes("KECIL")) navigator.vibrate(500);
    }

    async function startApp() {
        if (running) return;
        running = true;
        document.getElementById('status-box').innerText = "SYSTEM ONLINE (MONITORING)";
        document.getElementById('status-box').classList.add('online');
        navigator.vibrate(100); 
        listen();
    }

    async function listen() {
        // Offset -1 memastikan kita mengambil pesan PALING BARU saat aplikasi dibuka
        const offset = lastId === 0 ? -1 : lastId + 1;
        const url = `https://api.telegram.org/bot${TOKEN}/getUpdates?offset=${offset}&timeout=25`;

        try {
            const resp = await fetch(url);
            const data = await resp.json();

            if (data.ok && data.result.length > 0) {
                data.result.forEach(u => {
                    lastId = u.update_id;
                    if (u.message && u.message.text) {
                        const txt = u.message.text;
                        const log = document.getElementById('log-area');
                        
                        let cls = txt.includes("BESAR") ? "BSR" : (txt.includes("KECIL") ? "KCL" : "");
                        
                        const div = document.createElement('div');
                        div.className = `item ${cls}`;
                        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${txt.replace(/\n/g, '<br>')}`;
                        log.prepend(div);

                        vibrate(txt.toUpperCase());
                    }
                });
            }
        } catch (e) {
            console.log("Reconnecting...");
        }
        setTimeout(listen, 1000);
    }
</script>
</body>
</html>
