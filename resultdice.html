<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINAL MONITOR DADU</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; margin: 0; }
        .box { border: 1px solid #0f0; padding: 15px; border-radius: 5px; max-width: 400px; margin: auto; }
        #btn { width: 100%; padding: 20px; background: #0f0; color: #000; border: none; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
        #btn:active { background: #008800; }
        #log { height: 300px; overflow-y: auto; background: #050505; padding: 10px; border: 1px solid #222; margin-top: 10px; font-size: 12px; }
        .entry { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 5px; }
        .BESAR { color: #ff0000; font-weight: bold; }
        .KECIL { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <button id="btn">TAP UNTUK CONNECT (FORCE)</button>
    <div id="status">Status: Disconnected</div>
    <div id="log">Klik tombol di atas...</div>
</div>

<script>
    const TOKEN = "8233330794:AAHVHw4_k6QNCzWu450BzABvuJiXGVBi4ZU";
    let lastId = 0;

    [span_2](start_span)// Fungsi getar[span_2](end_span)
    function vibrator(msg) {
        if (!navigator.vibrate) return;
        if (msg.includes("DADU_BESAR")) navigator.vibrate([200, 100, 200]);
        else if (msg.includes("DADU_KECIL")) navigator.vibrate(500);
    }

    document.getElementById('btn').onclick = async function() {
        this.innerText = "SEDANG SINKRONISASI...";
        document.getElementById('status').innerText = "Status: Cleaning Webhook...";
        
        // LANGKAH 1: Paksa hapus webhook agar bot bisa pakai getUpdates
        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/deleteWebhook`);
            document.getElementById('status').innerText = "Status: Online (Monitoring)";
            this.style.background = "#555";
            this.disabled = true;
            loop();
        } catch (e) {
            alert("Gagal koneksi ke API Telegram");
        }
    };

    async function loop() {
        // Gunakan offset -1 untuk mengambil 1 pesan terbaru yang masuk saja
        const offset = lastId === 0 ? -1 : lastId + 1;
        
        try {
            const resp = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?offset=${offset}&timeout=10`);
            const data = await resp.json();

            if (data.ok && data.result.length > 0) {
                data.result.forEach(u => {
                    lastId = u.update_id;
                    if (u.message && u.message.text) {
                        const txt = u.message.text;
                        const log = document.getElementById('log');
                        const time = new Date().toLocaleTimeString();
                        
                        let type = "";
                        if (txt.includes("BESAR")) type = "BESAR";
                        if (txt.includes("KECIL")) type = "KECIL";

                        const div = document.createElement('div');
                        div.className = `entry ${type}`;
                        div.innerHTML = `[${time}] ${txt.replace(/\n/g, '<br>')}`;
                        log.prepend(div);

                        vibrator(txt.toUpperCase());
                    }
                });
            }
        } catch (e) {}
        setTimeout(loop, 1000);
    }
</script>

</body>
</html>
