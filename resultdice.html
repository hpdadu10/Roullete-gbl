<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Dadu BK</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #333; }
        h2 { color: #0088cc; margin-top: 0; }
        #startBtn { padding: 15px; width: 100%; background: #0088cc; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4); }
        #startBtn.active { background: #00c851; box-shadow: 0 4px 15px rgba(0, 200, 81, 0.4); }
        #log-container { height: 350px; overflow-y: auto; background: #000; border-radius: 10px; padding: 15px; text-align: left; border: 1px solid #444; display: flex; flex-direction: column; }
        .log-entry { padding: 10px; border-bottom: 1px solid #222; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.4; }
        .besar { color: #ff4444; font-weight: bold; background: rgba(255, 68, 68, 0.1); border-radius: 4px; padding: 2px 5px; }
        .kecil { color: #00c851; font-weight: bold; background: rgba(0, 200, 81, 0.1); border-radius: 4px; padding: 2px 5px; }
        .status-info { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Monitoring Dadu BK</h2>
    
    <button id="startBtn">AKTIFKAN MONITORING & GETAR</button>
    
    <div style="margin-bottom: 15px; font-size: 14px;">
        Status: <span id="connStatus" style="color: #ff4444;">Offline</span>
    </div>

    <div id="log-container">
        <div class="log-entry" style="color: #ffbb33;">Silakan klik tombol di atas untuk memulai...</div>
    </div>
    
    <div class="status-info">
        * Getar 2x untuk <b>DADU_BESAR</b><br>
        * Getar 1x untuk <b>DADU_KECIL</b>
    </div>
</div>

<script>
    const token = "8233330794:AAHVHw4_k6QNCzWu450BzABvuJiXGVBi4ZU";
    let lastUpdateId = 0;
    let isRunning = false;

    const startBtn = document.getElementById('startBtn');
    const connStatus = document.getElementById('connStatus');
    const logContainer = document.getElementById('log-container');

    // Fungsi getar perangkat
    function vibrateDevice(mode) {
        if ("vibrate" in navigator) {
            if (mode === "BESAR") {
                // Getar 2 kali: Getar 200ms, Jeda 100ms, Getar 200ms
                navigator.vibrate([200, 100, 200]);
            } else if (mode === "KECIL") {
                // Getar 1 kali panjang: 500ms
                navigator.vibrate(500);
            }
        }
    }

    // Tombol Aktivasi (Wajib diklik agar browser mengizinkan getar)
    startBtn.addEventListener('click', function() {
        if (!isRunning) {
            isRunning = true;
            this.innerHTML = "MONITORING AKTIF";
            this.classList.add('active');
            connStatus.innerHTML = "Online (Mencari Data...)";
            connStatus.style.color = "#00c851";
            
            // Test getar awal
            navigator.vibrate(100); 
            
            // Mulai ambil data
            addLog("Sistem diaktifkan. Menunggu laporan game...");
            fetchUpdates();
        }
    });

    async function fetchUpdates() {
        if (!isRunning) return;

        try {
            // Mengambil update dari Telegram API
            const response = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=${lastUpdateId + 1}&timeout=20`);
            const data = await response.json();

            if (data.ok && data.result.length > 0) {
                data.result.forEach(update => {
                    lastUpdateId = update.update_id;
                    if (update.message && update.message.text) {
                        processMessage(update.message.text);
                    }
                });
            }
        } catch (error) {
            console.error("Connection error:", error);
        }

        // Loop terus menerus setiap 2 detik
        setTimeout(fetchUpdates, 2000);
    }

    function processMessage(msg) {
        const time = new Date().toLocaleTimeString();
        let htmlContent = `[${time}] ${msg}`;
        let type = "";

        if (msg.includes("HASIL: DADU_BESAR")) {
            type = "besar";
            vibrateDevice("BESAR");
        } else if (msg.includes("HASIL: DADU_KECIL")) {
            type = "kecil";
            vibrateDevice("KECIL");
        }

        addLog(htmlContent, type);
    }

    function addLog(content, typeClass = "") {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        if (typeClass) {
            entry.innerHTML = `<span class="${typeClass}">${content}</span>`;
        } else {
            entry.innerHTML = content;
        }
        
        // Tambahkan ke paling atas
        logContainer.prepend(entry);
    }
</script>

</body>
</html>
