<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Dadu BK Pro</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        .card { max-width: 450px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        #status-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
        .btn-off { background: #ff4444; color: white; }
        .btn-on { background: #00c851; color: white; }
        #log { height: 400px; overflow-y: auto; background: #000; border-radius: 10px; padding: 10px; text-align: left; border: 1px solid #333; }
        .entry { padding: 8px; border-bottom: 1px solid #222; font-family: monospace; font-size: 12px; animation: fadeIn 0.5s; }
        .besar { color: #ff4444; border-left: 4px solid #ff4444; padding-left: 10px; }
        .kecil { color: #00c851; border-left: 4px solid #00c851; padding-left: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="card">
    <h2>Monitoring Dadu BK</h2>
    <button id="status-btn" class="btn-off">KLIK UNTUK AKTIFKAN MONITORING</button>
    
    <div id="log">
        <div class="entry" style="color: #888;">Sistem menunggu aktivasi...</div>
    </div>
</div>

<script>
    const token = "8233330794:AAHVHw4_k6QNCzWu450BzABvuJiXGVBi4ZU";
    const chatId = "1988855705";
    let lastUpdateId = 0;
    let isActive = false;

    const btn = document.getElementById('status-btn');
    const log = document.getElementById('log');

    // Fungsi Getar (Sesuai Permintaan)
    function handleVibration(text) {
        if (!("vibrate" in navigator)) return;
        
        if (text.includes("DADU_BESAR")) {
            navigator.vibrate([200, 100, 200]); // Getar 2 kali
        } else if (text.includes("DADU_KECIL")) {
            navigator.vibrate(500); // Getar 1 kali
        }
    }

    btn.addEventListener('click', () => {
        if (!isActive) {
            isActive = true;
            btn.innerText = "MONITORING AKTIF (ONLINE)";
            btn.className = "btn-on";
            addLog("Mencari laporan terbaru...", "#888");
            navigator.vibrate(100); // Feedback getar saat tombol ditekan
            startMonitoring();
        }
    });

    async function startMonitoring() {
        if (!isActive) return;

        // Logika "Pasti Membaca": Jika baru mulai (lastUpdateId=0), gunakan offset negatif
        // -10 artinya mengambil 10 pesan terakhir yang ada di server Telegram
        const offset = lastUpdateId === 0 ? -10 : lastUpdateId + 1;
        const url = `https://api.telegram.org/bot${token}/getUpdates?offset=${offset}&timeout=30`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.ok && data.result.length > 0) {
                data.result.forEach(update => {
                    lastUpdateId = update.update_id;
                    if (update.message && update.message.text) {
                        const msgText = update.message.text;
                        
                        // Filter pesan berdasarkan ID Anda agar tidak tercampur pesan orang lain
                        if (String(update.message.chat.id) === chatId) {
                            displayMessage(msgText);
                            handleVibration(msgText);
                        }
                    }
                });
            }
        } catch (err) {
            console.log("Reconnecting...");
        }

        // Loop monitoring
        setTimeout(startMonitoring, 1500);
    }

    function displayMessage(text) {
        let type = "";
        if (text.includes("DADU_BESAR")) type = "besar";
        if (text.includes("DADU_KECIL")) type = "kecil";

        const div = document.createElement('div');
        div.className = `entry ${type}`;
        div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong><br>${text.replace(/\n/g, '<br>')}`;
        log.prepend(div);
    }

    function addLog(text, color) {
        const div = document.createElement('div');
        div.className = 'entry';
        div.style.color = color;
        div.innerText = text;
        log.prepend(div);
    }
</script>

</body>
</html>
