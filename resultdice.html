<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Real-Time Dadu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #0088cc; }
        #log-container { height: 300px; overflow-y: auto; background: #000; border-radius: 8px; padding: 10px; margin-top: 20px; text-align: left; border: 1px solid #333; }
        .log-entry { padding: 8px; border-bottom: 1px solid #222; font-family: monospace; font-size: 13px; }
        .besar { color: #ff4444; font-weight: bold; }
        .kecil { color: #00c851; font-weight: bold; }
        .info { color: #ffbb33; }
        .status-dot { height: 10px; width: 10px; background-color: #00c851; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Monitoring Dadu BK</h2>
    <div style="font-size: 14px; margin-bottom: 10px;">
        <span class="status-dot"></span> System Active
    </div>
    <p>Menunggu data dari bot Telegram...</p>
    
    <div id="log-container">
        <div class="log-entry info">Inisialisasi sistem...</div>
    </div>
    
    <p style="font-size: 12px; color: #888; margin-top: 15px;">Pastikan browser Anda diizinkan untuk memberikan getaran (Vibration API).</p>
</div>

<script>
    const token = "8233330794:AAHVHw4_k6QNCzWu450BzABvuJiXGVBi4ZU";
    let lastUpdateId = 0;

    // Fungsi untuk menggetarkan perangkat
    function vibrateDevice(times) {
        if ("vibrate" in navigator) {
            if (times === 2) {
                // Getar 2 kali (Besar): 200ms getar, 100ms jeda, 200ms getar
                navigator.vibrate([200, 100, 200]);
            } else if (times === 1) {
                // Getar 1 kali (Kecil): 500ms getar
                navigator.vibrate(500);
            }
        }
    }

    async function fetchTelegramUpdates() {
        try {
            const response = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=${lastUpdateId + 1}`);
            const data = await response.json();

            if (data.ok && data.result.length > 0) {
                data.result.forEach(update => {
                    lastUpdateId = update.update_id;
                    if (update.message && update.message.text) {
                        const text = update.message.text;
                        const logContainer = document.getElementById('log-container');
                        const time = new Date().toLocaleTimeString();
                        
                        let className = "";
                        [span_0](start_span)// Logika Getar & Warna berdasarkan isi pesan[span_0](end_span)
                        if (text.includes("DADU_BESAR")) {
                            className = "besar";
                            vibrateDevice(2); // Getar 2 kali
                        } else if (text.includes("DADU_KECIL")) {
                            className = "kecil";
                            vibrateDevice(1); // Getar 1 kali
                        }

                        // Tambahkan entri ke log
                        const entry = document.createElement('div');
                        entry.className = 'log-entry';
                        entry.innerHTML = `[${time}] <span class="${className}">${text}</span>`;
                        logContainer.prepend(entry);
                    }
                });
            }
        } catch (e) {
            console.error("Gagal mengambil update:", e);
        }
    }

    // Jalankan pengecekan setiap 2 detik
    setInterval(fetchTelegramUpdates, 2000);
</script>

</body>
</html>
